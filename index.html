
<!doctype html>
<html lang="en">
  <head>
    <!-- =========================================
         1. CORE DOCUMENT SETTINGS
    ========================================== -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- =========================================
         2. BRANDING & SEO
    ========================================== -->
    <title>
      Virtue Mechanics
    </title>

    <meta
      name="description"
      content="Virtue Mechanics delivers precision 3D printing, rapid prototyping, and advanced manufacturing solutions. Explore FDM, SLA, and SLS technologies to transform innovative concepts into high-quality physical products."
    />

    <meta name="author" content="Virtue Mechanics" />
    <meta name="theme-color" content="#070b12" />

    <!-- =========================================
         3. SEARCH ENGINE INDEXING
    ========================================== -->
    <meta name="robots" content="index, follow" />

    <link
      rel="canonical"
      href="https://virtumechanics.com/"
    />

    <!-- =========================================
         4. SINGLE BRAND LOGO / FAVICON
         File: public/virtue-logo.svg
    ========================================== -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="/virtue-logo.svg"
    />

    <!-- =========================================
         5. FACEBOOK & LINKEDIN SHARING METADATA
    ========================================== -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Virtue Mechanics" />
    <meta property="og:locale" content="en_US" />

    <meta
      property="og:url"
      content="https://virtumechanics.com/"
    />

    <meta
      property="og:title"
      content="Virtue Mechanics | Precision 3D Printing & Advanced Manufacturing"
    />

    <meta
      property="og:description"
      content="Transform innovative ideas into precision-engineered reality with Virtue Mechanics. Discover advanced 3D printing, rapid prototyping, and custom manufacturing solutions."
    />

    <meta
      property="og:image"
      content="https://virtumechanics.com/virtue-logo.svg"
    />

    <meta
      property="og:image:alt"
      content="Virtue Mechanics company logo"
    />

    <!-- =========================================
         6. TWITTER / X SHARING METADATA
    ========================================== -->
    <meta name="twitter:card" content="summary" />

    <meta
      name="twitter:title"
      content="Virtue Mechanics | Precision 3D Printing"
    />

    <meta
      name="twitter:description"
      content="Precision 3D printing, rapid prototyping, and advanced manufacturing solutions from Virtue Mechanics."
    />

    <meta
      name="twitter:image"
      content="https://virtumechanics.com/virtue-logo.svg"
    />

    <meta
      name="twitter:image:alt"
      content="Virtue Mechanics company logo"
    />

    <!-- =========================================
         7. FONT PERFORMANCE OPTIMIZATION
    ========================================== -->
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
